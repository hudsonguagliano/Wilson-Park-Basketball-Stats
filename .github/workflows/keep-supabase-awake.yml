name: Keep Supabase awake

# Supabase pauses free projects after about a week with no database activity.
# This reads one row every 3 days so the project never pauses.
# It only reads, using the public (publishable) key, so it can't change anything.

on:
  schedule:
    - cron: "0 15 */3 * *" # 15:00 UTC every 3rd day of the month (1st, 4th, 7th, ...)
  workflow_dispatch: # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row from Supabase
        env:
          SUPABASE_URL: https://mtquolkyzbsgolofazkr.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_KEY" ]; then
            echo "Missing the SUPABASE_PUBLISHABLE_KEY repository secret."
            exit 1
          fi
          status=$(curl -s -o response.json -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/season_players?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY")
          echo "Supabase answered HTTP $status"
          cat response.json
          echo
          # Fail the run (GitHub emails you) if Supabase didn't answer normally
          test "$status" = "200"
