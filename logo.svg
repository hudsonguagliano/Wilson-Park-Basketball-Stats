<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 240 240" role="img" aria-label="Wilson Park Monday Night Hoops logo">
  <defs>
    <path id="topArc" d="M 36,120 A 84,84 0 0 1 204,120"/>
    <path id="bottomArc" d="M 20,120 A 100,100 0 0 0 220,120"/>
  </defs>

  <!-- Outer badge -->
  <circle cx="120" cy="120" r="116" fill="#1d1f23"/>
  <circle cx="120" cy="120" r="110" fill="none" stroke="#c2410c" stroke-width="3"/>

  <!-- Basketball -->
  <circle cx="120" cy="120" r="68" fill="#c2410c" stroke="#ffffff" stroke-width="3"/>
  <g fill="none" stroke="#1d1f23" stroke-width="4" stroke-linecap="round">
    <line x1="120" y1="52" x2="120" y2="188"/>
    <line x1="52" y1="120" x2="188" y2="120"/>
    <path d="M 75,69 Q 105,120 75,171"/>
    <path d="M 165,69 Q 135,120 165,171"/>
  </g>

  <!-- Text around the ball -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <text font-size="21" letter-spacing="3">
      <textPath href="#topArc" xlink:href="#topArc" startOffset="50%">WILSON PARK</textPath>
    </text>
    <text font-size="12.5" letter-spacing="2.5">
      <textPath href="#bottomArc" xlink:href="#bottomArc" startOffset="50%">MONDAY NIGHT HOOPS</textPath>
    </text>
  </g>
</svg>
